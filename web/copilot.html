<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>案 · 命师案头 · 算 suan</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: { extend: {
        colors: {
          ink: '#1a1a1a', 'ink-soft': '#2c2c2c',
          paper: '#faf6f0', 'paper-dark': '#ede5d3',
          vermilion: '#c8403c', celadon: '#4a6670',
          gold: '#b89968', jade: '#5d7c6a', silver: '#a09b94',
        },
        fontFamily: {
          'serif-cn': ['"Source Han Serif SC"','"Noto Serif SC"','serif'],
          'sans-cn':  ['"PingFang SC"','"Source Han Sans SC"','system-ui','sans-serif'],
          'serif-en': ['"Lora"','Georgia','serif'],
          'sans-en':  ['"Inter"','system-ui','sans-serif'],
        }
      }}
    }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Lora:wght@400;500;600&family=Noto+Serif+SC:wght@400;500;600&display=swap" rel="stylesheet" />
  <script src="/static/js/app.js"></script>
  <script src="/static/js/enhance.js"></script>
  <script defer src="https://unpkg.com/alpinejs@3.13.5/dist/cdn.min.js"></script>
  <link rel="stylesheet" href="/static/css/style.css" />
  <link rel="stylesheet" href="/static/css/enhance.css" />
  <link rel="icon" type="image/svg+xml" href="/static/img/logo.svg" />
  <style>
    .client-row {
      display: flex; align-items: center; gap: 10px;
      padding: 10px 14px; cursor: pointer;
      border-bottom: 1px solid var(--line);
    }
    .client-row:hover { background: rgba(184,153,104,.06); }
    .client-row.active { background: rgba(200,64,60,.06); border-left: 3px solid var(--vermilion); padding-left: 11px; }
    .client-avatar {
      width: 34px; height: 34px; border-radius: 2px;
      background: var(--paper-dark); color: var(--ink);
      display: flex; align-items: center; justify-content: center;
      font-family: var(--font-serif-cn); font-size: 14px;
      letter-spacing: 0.04em;
    }
    .client-avatar.gen-male { background: rgba(74,102,112,.12); color: var(--celadon); }
    .client-avatar.gen-female { background: rgba(200,64,60,.10); color: var(--vermilion); }
    .draft-area {
      font-family: var(--font-serif-cn);
      font-size: 14.5px; line-height: 1.85;
      padding: 24px 28px; background: var(--paper);
      border: 1px solid var(--line);
      min-height: 500px; outline: none;
    }
    .draft-area:focus { border-color: var(--ink); }
    .draft-area .h2 { font-family: var(--font-serif-cn); font-size: 20px; margin: 24px 0 10px; padding-bottom: 8px; border-bottom: 1px solid var(--ink); display: block; }
    .draft-area .h3 { font-family: var(--font-serif-cn); font-size: 16px; margin: 18px 0 8px; padding-left: 10px; border-left: 3px solid var(--vermilion); display: block; }
    .draft-area .placeholder-tag { background: rgba(184,153,104,.15); color: var(--gold); padding: 1px 6px; font-size: 12px; }
    .panel-tab {
      padding: 10px 16px; font-size: 12px; letter-spacing: 0.18em;
      border-bottom: 2px solid transparent; cursor: pointer; color: var(--silver-grey);
    }
    .panel-tab.active { color: var(--ink); border-color: var(--ink); }
    .kb-result {
      padding: 10px 12px; border: 1px solid var(--line);
      margin-bottom: 8px; font-size: 12.5px; line-height: 1.7;
      background: var(--paper);
    }
    .kb-result .source { color: var(--vermilion); font-size: 11px; letter-spacing: 0.18em; }
    .ai-hint {
      padding: 12px 14px; border-left: 3px solid var(--gold);
      background: rgba(184,153,104,.06); margin-bottom: 8px;
      font-size: 12.5px; line-height: 1.7;
    }
  </style>
</head>
<body class="font-sans-cn text-ink h-screen flex flex-col overflow-hidden">

<!-- Top bar -->
<header class="border-b border-[var(--line)] bg-paper flex-shrink-0">
  <div class="px-5 lg:px-8 py-3 flex items-center justify-between">
    <a href="/" class="flex items-center gap-3">
      <span class="seal seal--sm brand-seal-auto">算</span>
      <span class="flex flex-col leading-tight">
        <span class="font-serif-cn text-[16px] tracking-[0.18em]">算 · 案头</span>
        <span class="title-eyebrow">命理师工作台</span>
      </span>
    </a>
    <nav class="hidden md:flex items-center gap-7 text-[12.5px] tracking-[0.16em] text-ink-soft">
      <a href="/chat" class="hover:text-vermilion transition">问 · 一席话</a>
      <a href="/report" class="hover:text-vermilion transition">研 · 一卷书</a>
      <span class="text-vermilion">案 · 命师案头</span>
    </nav>
    <div class="flex items-center gap-3 text-[12.5px] text-ink-soft">
      <span class="confidence confidence-medium">流派 · 子平 + 中州 + 现代心理派</span>
      <button class="btn btn-outline btn-sm" onclick="window.print()">另存白本</button>
    </div>
  </div>
  <div class="weather-ribbon weather-ribbon-auto"></div>
</header>

<!-- 三栏布局 -->
<main class="flex-1 grid grid-cols-12 gap-0 overflow-hidden" x-data="copilotApp()">

  <!-- 左：客户列表 -->
  <aside class="col-span-12 md:col-span-3 lg:col-span-2 border-r border-[var(--line)] bg-paper flex flex-col overflow-hidden">
    <div class="p-4 border-b border-[var(--line)]">
      <div class="title-eyebrow mb-3">客 · 帙</div>
      <div class="flex gap-2">
        <input class="input flex-1 text-[12.5px]" placeholder="搜索客户" x-model="searchTerm"/>
        <button class="btn btn-primary btn-sm" @click="addClientPrompt()">+</button>
      </div>
    </div>
    <div class="flex-1 overflow-y-auto">
      <template x-for="c in filteredClients" :key="c.id">
        <div :class="'client-row ' + (c.id === currentId ? 'active' : '')" @click="selectClient(c)">
          <div :class="'client-avatar gen-' + c.gender" x-text="(c.name||'?').slice(0,1)"></div>
          <div class="flex-1 min-w-0">
            <div class="font-serif-cn text-[13px] tracking-[0.06em] truncate" x-text="c.name"></div>
            <div class="text-[10.5px] text-silver tracking-[0.1em]" x-text="(c.gender === 'male' ? '乾' : '坤') + ' · ' + c.date + (c.time ? ' ' + c.time : '')"></div>
          </div>
        </div>
      </template>
    </div>
  </aside>

  <!-- 中：盘面 + 草稿 -->
  <section class="col-span-12 md:col-span-6 lg:col-span-7 flex flex-col overflow-hidden">

    <!-- 客户头部 -->
    <div class="border-b border-[var(--line)] bg-paper px-6 py-4" x-show="current">
      <div class="flex items-end justify-between gap-4">
        <div>
          <div class="title-eyebrow">案前 · 客</div>
          <div class="font-serif-cn text-[24px] tracking-[0.06em] text-ink mt-1" x-text="current ? current.name : ''"></div>
          <div class="text-[12px] text-silver mt-1 tracking-[0.1em]" x-text="current ? clientLine(current) : ''"></div>
        </div>
        <div class="flex gap-2">
          <button class="btn btn-outline btn-sm" @click="loadCharts()">重 · 排盘</button>
          <button class="btn btn-primary btn-sm" @click="generateDraft()" :disabled="generating">
            <span x-text="generating ? '研判中…' : '起卷 · 草稿'"></span>
          </button>
        </div>
      </div>

      <!-- 盘面 mini -->
      <div class="grid grid-cols-2 lg:grid-cols-4 gap-3 mt-4" x-show="charts.bazi">
        <div class="hairline rounded-sm p-3 text-center">
          <div class="text-[10px] tracking-[0.18em] text-silver">日主</div>
          <div class="font-serif-cn text-[20px] mt-1" x-text="charts.bazi ? charts.bazi.day_master : '—'"></div>
        </div>
        <div class="hairline rounded-sm p-3 text-center">
          <div class="text-[10px] tracking-[0.18em] text-silver">格局</div>
          <div class="font-serif-cn text-[16px] mt-1" x-text="charts.bazi ? charts.bazi.pattern : '—'"></div>
        </div>
        <div class="hairline rounded-sm p-3 text-center">
          <div class="text-[10px] tracking-[0.18em] text-silver">用神</div>
          <div class="font-serif-cn text-[16px] mt-1" x-text="charts.bazi ? (charts.bazi.yong_shen || '—') : '—'"></div>
        </div>
        <div class="hairline rounded-sm p-3 text-center">
          <div class="text-[10px] tracking-[0.18em] text-silver">太阳</div>
          <div class="font-serif-cn text-[16px] mt-1" x-text="(charts.natal_astro && charts.natal_astro.planets && charts.natal_astro.planets.sun) ? charts.natal_astro.planets.sun.sign : '—'"></div>
        </div>
      </div>
    </div>

    <!-- 编辑器 -->
    <div class="flex-1 overflow-y-auto p-6 lg:p-8 bg-paper-dark/30">
      <div class="max-w-3xl mx-auto">
        <div class="flex items-center justify-between mb-3">
          <div class="title-eyebrow">草稿 · 可编辑</div>
          <div class="flex gap-2">
            <button class="btn btn-ghost btn-sm" @click="copyDraft()">复制全文</button>
            <button class="btn btn-ghost btn-sm" @click="saveDraft()">保存</button>
          </div>
        </div>
        <div class="draft-area" contenteditable="true" x-ref="draft" x-html="draftHtml"></div>
      </div>
    </div>
  </section>

  <!-- 右：知识库速查 + AI 思路提示 -->
  <aside class="hidden lg:flex col-span-3 border-l border-[var(--line)] bg-paper flex-col overflow-hidden">
    <div class="border-b border-[var(--line)] px-4">
      <div class="flex">
        <div :class="'panel-tab ' + (panel === 'kb' ? 'active' : '')" @click="panel='kb'">典籍速查</div>
        <div :class="'panel-tab ' + (panel === 'hint' ? 'active' : '')" @click="panel='hint'">AI 思路</div>
        <div :class="'panel-tab ' + (panel === 'trace' ? 'active' : '')" @click="panel='trace'">推理路径</div>
      </div>
    </div>

    <!-- 知识库速查 -->
    <div class="flex-1 overflow-y-auto p-4" x-show="panel === 'kb'">
      <input class="input w-full text-[12.5px]" placeholder="搜典籍 / 术语" x-model="kbQuery" @input.debounce.300="searchKB()"/>
      <div class="mt-3">
        <template x-for="(r, i) in kbResults" :key="i">
          <div class="kb-result">
            <div class="source mb-1" x-text="r.title || r.source_id"></div>
            <div x-text="r.summary || r.quote || ''"></div>
          </div>
        </template>
        <template x-if="!kbResults.length">
          <div class="text-[12px] text-silver mt-3">输入关键词以搜索典籍 / 术语</div>
        </template>
      </div>
    </div>

    <!-- AI 思路 -->
    <div class="flex-1 overflow-y-auto p-4" x-show="panel === 'hint'">
      <div class="title-eyebrow mb-3">七路 · 思路</div>
      <template x-for="(h, i) in aiHints" :key="i">
        <div class="ai-hint">
          <div class="text-[10.5px] text-vermilion tracking-[0.18em] mb-1" x-text="'· ' + h.expert + ' · ' + (h.confidence||'')"></div>
          <div x-text="h.text"></div>
        </div>
      </template>
      <template x-if="!aiHints.length">
        <div class="text-[12px] text-silver mt-3">点击"起卷 · 草稿"后此处会显示各 Expert Agent 的研判要点。</div>
      </template>
    </div>

    <!-- 推理路径 -->
    <div class="flex-1 overflow-y-auto p-4" x-show="panel === 'trace'">
      <div class="title-eyebrow mb-3">推理 · 路径</div>
      <template x-for="(s, i) in traceSteps" :key="i">
        <div class="text-[12px] mb-2 hairline rounded-sm p-2">
          <div class="text-vermilion text-[10.5px] tracking-[0.16em]" x-text="String(i+1).padStart(2,'0') + ' · ' + s.agent"></div>
          <div class="text-ink-soft mt-1" x-text="s.action"></div>
        </div>
      </template>
      <template x-if="!traceSteps.length">
        <div class="text-[12px] text-silver mt-3">推理路径将在生成草稿后显示。</div>
      </template>
    </div>

    <!-- footer -->
    <div class="border-t border-[var(--line)] p-3 text-[11px] text-silver tracking-[0.12em] flex justify-between">
      <span>Backend</span>
      <span x-data x-show="$store().backendOnline" class="text-jade">ONLINE</span>
      <span x-data x-show="!$store().backendOnline" class="text-vermilion">OFFLINE</span>
    </div>
  </aside>

</main>

<script>
function copilotApp() {
  return {
    clients: [
      { id: 'demo1', name: '张明远', gender: 'male', date: '1985-03-12', time: '08:30', place: '北京' },
      { id: 'demo2', name: '陈书雅', gender: 'female', date: '1991-08-15', time: '14:30', place: '上海' },
      { id: 'demo3', name: '林子谦', gender: 'male', date: '1978-11-23', time: '20:15', place: '广州' },
      { id: 'demo4', name: '苏婉清', gender: 'female', date: '1996-04-07', time: '06:45', place: '杭州' },
      { id: 'demo5', name: '赵长河', gender: 'male', date: '1972-09-30', time: '12:00', place: '成都' },
      { id: 'demo6', name: '周韵彤', gender: 'female', date: '2001-02-14', time: '23:50', place: '深圳' },
    ],
    searchTerm: '',
    currentId: null,
    current: null,
    currentSid: null,
    panel: 'kb',
    charts: {},
    aiHints: [],
    traceSteps: [],
    kbQuery: '',
    kbResults: [],
    draftMd: '',
    draftHtml: '<div class="text-silver" style="padding:60px 0; text-align:center; font-size:14px;">选择左侧客户后，点击"起卷 · 草稿"开始。</div>',
    generating: false,

    get filteredClients() {
      const q = this.searchTerm.trim();
      if (!q) return this.clients;
      return this.clients.filter(c => c.name.includes(q) || c.place.includes(q));
    },

    init() {
      // Load any custom clients from storage
      try {
        const extra = JSON.parse(localStorage.getItem('suan.copilot.clients') || '[]');
        this.clients = [...extra, ...this.clients];
      } catch(e) {}
      // 选中第一个
      if (this.clients.length) this.selectClient(this.clients[0]);
    },

    clientLine(c) {
      return (c.gender === 'male' ? '乾造' : '坤造') + ' · ' +
             c.date + ' ' + (c.time || '') + ' · ' + (c.place || '');
    },

    async selectClient(c) {
      this.currentId = c.id;
      this.current = c;
      this.draftHtml = '<div class="text-silver" style="padding:60px 0; text-align:center; font-size:14px;">点击"起卷 · 草稿"以开始 AI 研判流程。</div>';
      this.aiHints = [];
      this.traceSteps = [];
      await this.loadCharts();
    },

    async loadCharts() {
      if (!this.current) return;
      try {
        const res = await fetch('/api/v1/charts', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            profile: { ...this.current, scenario: 'copilot' },
            question: '',
          }),
        });
        const data = await res.json();
        this.charts = data.charts || {};
      } catch(e) { console.error(e); }
    },

    async searchKB() {
      const q = this.kbQuery.trim();
      if (q.length < 2) { this.kbResults = []; return; }
      try {
        const res = await fetch('/api/v1/knowledge/search', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ query: q, top_k: 8 }),
        });
        if (!res.ok) { this.kbResults = []; return; }
        const data = await res.json();
        this.kbResults = data.results || [];
      } catch(e) { this.kbResults = []; }
    },

    async generateDraft() {
      if (!this.current) return;
      this.generating = true;
      this.draftHtml = '<div style="padding:24px;color:var(--silver-grey);">研判合议正在工作（流式生成，预计 1–3 分钟） …</div>';
      this.aiHints = [];
      this.traceSteps = [];
      this.draftMd = '';

      try {
        // 1) 注册 session
        const reg = await fetch('/api/v1/sessions', {
          method: 'POST', headers: {'Content-Type':'application/json'},
          body: JSON.stringify({ ...this.current, scenario: 'copilot' }),
        }).then(r => r.json());
        if (!reg || !reg.session_id) throw new Error('注册会话失败');
        this.currentSid = reg.session_id;

        // 2) 投问题
        await fetch(`/api/v1/sessions/${this.currentSid}/messages`, {
          method: 'POST', headers: {'Content-Type':'application/json'},
          body: JSON.stringify({
            text: '请综合中西命理给客户做一份正式研判草稿（用专业术语、保留 [可调整] 标注，便于命师二次润色）。',
          }),
        });

        // 3) 开 SSE
        await this.streamDraft();
      } catch (e) {
        this.draftHtml = '<div style="padding:24px;color:var(--vermilion);">生成失败：' + e.message + '</div>';
      } finally {
        this.generating = false;
      }
    },

    streamDraft() {
      return new Promise((resolve) => {
        const url = `/api/v1/sessions/${encodeURIComponent(this.currentSid)}/stream`;
        const es = new EventSource(url);
        const events = [
          'start','phase','classifier_done','chart_ready','charts_summary',
          'expert_done','verifier_log','synth_done','aligner_done','aligner_skipped',
          'verdict_done','narrative_chunk','narrative','done','error'
        ];
        events.forEach(name => {
          es.addEventListener(name, (e) => {
            let data; try { data = JSON.parse(e.data); } catch(_) { data = e.data; }
            this.handleStreamEvent(name, data);
            if (name === 'done' || name === 'error') {
              try { es.close(); } catch(_) {}
              resolve();
            }
          });
        });
        es.onerror = () => {};
      });
    },

    handleStreamEvent(evt, data) {
      switch (evt) {
        case 'expert_done':
          this.aiHints.push({
            expert: data.expert,
            confidence: data.confidence,
            text: data.summary || data.headline,
          });
          this.traceSteps.push({ agent: data.expert, action: data.headline || 'expert_done' });
          break;
        case 'aligner_done':
          this.traceSteps.push({ agent: 'aligner',
            action: `共识 ${((data.consensus_score||0)*100).toFixed(0)}% / 分歧 ${((data.divergence_score||0)*100).toFixed(0)}%` });
          break;
        case 'verdict_done':
          this.traceSteps.push({ agent: 'judge', action: '综合判官 · ' + data.confidence });
          break;
        case 'narrative_chunk':
          this.draftMd = (this.draftMd || '') + (data.text || '');
          this.draftHtml = this.mdToHtml(this.draftMd);
          // 自动滚动
          this.$nextTick && this.$nextTick(() => {
            if (this.$refs && this.$refs.draft) this.$refs.draft.scrollTop = this.$refs.draft.scrollHeight;
          });
          break;
        case 'narrative':
          if (!this.draftMd || this.draftMd.length < 30) {
            this.draftMd = data.text || '';
            this.draftHtml = this.mdToHtml(this.draftMd);
          }
          break;
        case 'done':
          this.panel = 'hint';
          break;
      }
    },

    mdToHtml(md) {
      if (!md) return '';
      // 极简 md 转 html
      return md
        .replace(/^## (.+)$/gm, '<div class="h2">$1</div>')
        .replace(/^### (.+)$/gm, '<div class="h3">$1</div>')
        .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
        .replace(/\n\n/g, '</p><p>')
        .replace(/^/, '<p>')
        .replace(/$/, '</p>')
        .replace(/\[(.+?)\]/g, '<span class="placeholder-tag">[$1]</span>');
    },

    copyDraft() {
      const text = this.$refs.draft.innerText;
      navigator.clipboard.writeText(text);
      alert('草稿全文已复制。');
    },

    saveDraft() {
      const html = this.$refs.draft.innerHTML;
      const key = 'suan.copilot.draft.' + this.currentId;
      localStorage.setItem(key, html);
      alert('草稿已保存到本地。');
    },

    addClientPrompt() {
      const name = prompt('客户姓名 / 称呼？');
      if (!name) return;
      const date = prompt('阳历生日（YYYY-MM-DD）？');
      if (!date) return;
      const time = prompt('出生时间（HH:MM，可空）？') || '';
      const place = prompt('出生地（如 北京 / 上海）？') || '北京';
      const gender = (prompt('性别？输入 m / f', 'f') || 'f').toLowerCase().startsWith('m') ? 'male' : 'female';
      const c = {
        id: 'c_' + Date.now(),
        name, date, time, place, gender,
      };
      this.clients.unshift(c);
      // 持久化用户客户
      try {
        const extra = JSON.parse(localStorage.getItem('suan.copilot.clients') || '[]');
        extra.unshift(c);
        localStorage.setItem('suan.copilot.clients', JSON.stringify(extra));
      } catch(e) {}
      this.selectClient(c);
    },
  };
}
</script>

</body>
</html>
