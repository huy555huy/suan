<style>
  :root {
    --paper:        oklch(0.972 0.006 80);
    --paper-2:      oklch(0.948 0.008 78);
    --paper-3:      oklch(0.92 0.010 76);
    --ink:          oklch(0.18 0.013 260);
    --ink-2:        oklch(0.34 0.014 258);
    --ink-3:        oklch(0.52 0.012 256);
    --ink-4:        oklch(0.68 0.010 250);
    --cinnabar:     oklch(0.56 0.165 28);
    --cinnabar-2:   oklch(0.48 0.16 28);
    --cinnabar-3:   oklch(0.92 0.04 28);
    --gild:         oklch(0.78 0.045 78);
    --gild-2:       oklch(0.86 0.030 78);
    --jade:         oklch(0.52 0.06 168);

    --rule: 1px solid color-mix(in oklch, var(--gild) 50%, transparent);
    --rule-strong: 1px solid color-mix(in oklch, var(--ink) 50%, transparent);

    --serif-cn: "Noto Serif SC", "Source Han Serif", "Songti SC", serif;
    --serif-en: "EB Garamond", "Iowan Old Style", Georgia, serif;
    --mono:     "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
    --sans:     ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;

    --pad: 28px;
    --gutter: 56px;
    --screen-pad: clamp(20px, 4vw, 80px);
  }

  /* dark mode tokens */
  body[data-mode="dark"] {
    --paper:    oklch(0.16 0.010 258);
    --paper-2:  oklch(0.20 0.011 258);
    --paper-3:  oklch(0.24 0.012 258);
    --ink:      oklch(0.95 0.008 80);
    --ink-2:    oklch(0.82 0.010 80);
    --ink-3:    oklch(0.66 0.010 80);
    --ink-4:    oklch(0.50 0.010 80);
    --cinnabar: oklch(0.66 0.16 28);
    --cinnabar-2: oklch(0.74 0.15 28);
    --cinnabar-3: oklch(0.30 0.10 28);
    --gild:     oklch(0.55 0.05 78);
    --gild-2:   oklch(0.40 0.04 78);
  }

  body[data-palette="ink-only"] { --cinnabar: var(--ink); --cinnabar-2: var(--ink-2); --cinnabar-3: var(--paper-3); }

  body[data-density="dense"] { --pad: 18px; --gutter: 36px; }
  body[data-density="airy"]  { --pad: 40px; --gutter: 80px; }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--paper);
    color: var(--ink);
    font-family: var(--serif-cn);
    font-feature-settings: "palt", "kern";
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* paper texture — subtle */
  body::before {
    content: "";
    position: fixed; inset: 0;
    pointer-events: none;
    background:
      radial-gradient(1200px 800px at 10% 0%, color-mix(in oklch, var(--gild) 6%, transparent), transparent 60%),
      radial-gradient(900px 700px at 100% 100%, color-mix(in oklch, var(--cinnabar) 3%, transparent), transparent 70%);
    z-index: 0;
  }
  body[data-mode="dark"]::before {
    background:
      radial-gradient(1200px 800px at 10% 0%, color-mix(in oklch, var(--gild) 14%, transparent), transparent 60%),
      radial-gradient(900px 700px at 100% 100%, color-mix(in oklch, var(--cinnabar) 10%, transparent), transparent 70%);
  }

  ::selection { background: var(--cinnabar); color: var(--paper); }

  /* utility classes */
  .mono { font-family: var(--mono); font-feature-settings: "tnum","ss01"; letter-spacing: 0.01em; }
  .en { font-family: var(--serif-en); }
  .em { font-family: var(--serif-en); font-style: italic; }
  .pinyin { font-family: var(--mono); font-size: 0.72em; letter-spacing: 0.18em; text-transform: lowercase; color: var(--ink-3); font-weight: 400; }
  .caps { font-family: var(--mono); font-size: 0.72em; letter-spacing: 0.22em; text-transform: uppercase; color: var(--ink-3); font-weight: 400; }
  .num { font-family: var(--mono); font-feature-settings: "tnum"; }
  .hairline { background: linear-gradient(to right, transparent, var(--gild), transparent); height: 1px; }
  .hairline-v { background: linear-gradient(to bottom, transparent, var(--gild), transparent); width: 1px; }
  .vrule { width: 1px; align-self: stretch; background: var(--gild); opacity: 0.5; }

  /* the seal */
  .seal {
    display: inline-flex;
    align-items: center; justify-content: center;
    background: var(--cinnabar);
    color: var(--paper);
    font-family: var(--serif-cn);
    font-weight: 700;
    font-size: 18px;
    line-height: 1;
    width: 44px; height: 44px;
    border-radius: 4px;
    letter-spacing: 0;
    box-shadow:
      inset 0 0 0 2px var(--cinnabar),
      inset 0 0 0 4px color-mix(in oklch, var(--cinnabar) 50%, var(--paper));
    /* ink-stamp wear */
    filter: contrast(1.1) saturate(1.05);
    position: relative;
    transform: rotate(-2deg);
  }
  .seal::after {
    content: "";
    position: absolute; inset: 0;
    border-radius: 4px;
    background:
      radial-gradient(circle at 30% 20%, transparent 0 1px, color-mix(in oklch, var(--cinnabar) 100%, transparent) 1px 100%) 0 0/3px 3px,
      radial-gradient(circle at 70% 80%, transparent 0 1px, color-mix(in oklch, var(--cinnabar) 100%, transparent) 1px 100%) 1px 1px/3px 3px;
    mix-blend-mode: lighten;
    opacity: 0.5;
    pointer-events: none;
  }

  /* button system */
  .btn {
    display: inline-flex; align-items: center; gap: 12px;
    padding: 14px 22px;
    border: 1px solid var(--ink);
    background: var(--ink);
    color: var(--paper);
    font-family: var(--serif-cn);
    font-weight: 500;
    font-size: 15px;
    letter-spacing: 0.05em;
    cursor: pointer;
    border-radius: 0;
    transition: transform .12s ease, background .12s ease;
  }
  .btn:hover { background: var(--cinnabar); border-color: var(--cinnabar); }
  .btn-ghost {
    background: transparent;
    color: var(--ink);
    border-color: color-mix(in oklch, var(--ink) 50%, transparent);
  }
  .btn-ghost:hover { background: var(--ink); color: var(--paper); }
  .btn .arr { font-family: var(--mono); font-size: 13px; }

  input, textarea, select {
    font-family: var(--serif-cn);
    background: transparent;
    color: var(--ink);
    border: none;
    border-bottom: 1px solid color-mix(in oklch, var(--ink) 30%, transparent);
    border-radius: 0;
    padding: 10px 0;
    font-size: 17px;
    width: 100%;
    outline: none;
    transition: border-color .15s ease;
  }
  input:focus, textarea:focus, select:focus { border-bottom-color: var(--cinnabar); }
  input::placeholder { color: var(--ink-4); }

  /* nav */
  .topnav {
    position: sticky; top: 0; z-index: 50;
    display: flex; align-items: center;
    padding: 18px var(--screen-pad);
    background: color-mix(in oklch, var(--paper) 90%, transparent);
    backdrop-filter: blur(20px) saturate(140%);
    -webkit-backdrop-filter: blur(20px) saturate(140%);
    border-bottom: var(--rule);
  }
  .topnav .brand {
    display: flex; align-items: baseline; gap: 14px;
    margin-right: auto;
  }
  .topnav .brand .ch { font-size: 28px; font-weight: 700; letter-spacing: 0.08em; }
  .topnav .brand .ch::after {
    content: "·"; padding: 0 6px; color: var(--ink-3); font-weight: 400;
  }
  .topnav .brand .en { font-family: var(--serif-en); font-style: italic; font-size: 18px; color: var(--ink-2); }
  .topnav .links { display: flex; gap: 0; }
  .topnav .links button {
    appearance: none; background: transparent; border: none; cursor: pointer;
    padding: 10px 16px;
    font-family: var(--serif-cn); font-weight: 400; font-size: 15px; color: var(--ink-3);
    letter-spacing: 0.06em;
    position: relative;
    transition: color .15s ease;
  }
  .topnav .links button .pinyin { display: block; font-size: 9px; letter-spacing: 0.2em; margin-top: 2px; opacity: 0; transition: opacity .15s ease; color: var(--ink-4); }
  .topnav .links button:hover { color: var(--ink); }
  .topnav .links button:hover .pinyin { opacity: 1; }
  .topnav .links button[data-active="true"] { color: var(--ink); font-weight: 600; }
  .topnav .links button[data-active="true"] .pinyin { opacity: 1; color: var(--cinnabar); }
  .topnav .links button[data-active="true"]::after {
    content: ""; position: absolute; left: 16px; right: 16px; bottom: -19px; height: 2px; background: var(--cinnabar);
  }
  .topnav .right { display: flex; align-items: center; gap: 16px; margin-left: 24px; }
  .topnav .right .stamp { font-family: var(--mono); font-size: 11px; letter-spacing: 0.18em; color: var(--ink-3); text-transform: uppercase; }

  /* main */
  main { position: relative; z-index: 1; }

  /* fade in */
  .fade-in { animation: fade .35s ease both; }
  @keyframes fade { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

  /* common screen container */
  .screen { padding: clamp(40px, 6vw, 96px) var(--screen-pad); }

  /* corner brackets */
  .bracket { position: relative; }
  .bracket::before, .bracket::after {
    content: ""; position: absolute; width: 14px; height: 14px;
    border: 1.5px solid var(--cinnabar);
  }
  .bracket::before { top: -10px; left: -10px; border-right: none; border-bottom: none; }
  .bracket::after  { bottom: -10px; right: -10px; border-left: none; border-top: none; }

  /* chip */
  .chip {
    display: inline-flex; align-items: center; gap: 10px;
    padding: 6px 12px;
    border: 1px solid color-mix(in oklch, var(--ink) 25%, transparent);
    border-radius: 999px;
    font-size: 13px; color: var(--ink-2);
    letter-spacing: 0.04em;
  }
  .chip .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--cinnabar); }

  /* card */
  .card {
    background: color-mix(in oklch, var(--paper) 60%, var(--paper-2));
    border: var(--rule);
    padding: var(--pad);
  }

  /* thin scrollbar */
  *::-webkit-scrollbar { width: 8px; height: 8px; }
  *::-webkit-scrollbar-thumb { background: color-mix(in oklch, var(--ink) 20%, transparent); }
  *::-webkit-scrollbar-track { background: transparent; }

  @media (max-width: 900px) {
    .topnav .links { display: none; }
  }
</style>
</head>

// ── useTweaks ───────────────────────────────────────────────────────────────
// Single source of truth for tweak values. setTweak persists via the host
// (__edit_mode_set_keys → host rewrites the EDITMODE block on disk).
function useTweaks(defaults) {
  const [values, setValues] = React.useState(defaults);
  // Accepts either setTweak('key', value) or setTweak({ key: value, ... }) so a
  // useState-style call doesn't write a "[object Object]" key into the persisted
  // JSON block.
  const setTweak = React.useCallback((keyOrEdits, val) => {
    const edits = typeof keyOrEdits === 'object' && keyOrEdits !== null
      ? keyOrEdits : { [keyOrEdits]: val };
    setValues((prev) => ({ ...prev, ...edits }));
    window.parent.postMessage({ type: '__edit_mode_set_keys', edits }, '*');
    // Same-window signal so in-page listeners (deck-stage rail thumbnails)
    // can react — the parent message only reaches the host, not peers.
    window.dispatchEvent(new CustomEvent('tweakchange', { detail: edits }));
  }, []);
  return [values, setTweak];
}

// ── TweaksPanel ─────────────────────────────────────────────────────────────
// Floating shell. Registers the protocol listener BEFORE announcing
// availability — if the announce ran first, the host's activate could land
// before our handler exists and the toolbar toggle would silently no-op.
// The close button posts __edit_mode_dismissed so the host's toolbar toggle
// flips off in lockstep; the host echoes __deactivate_edit_mode back which
// is what actually hides the panel.
function TweaksPanel({ title = 'Tweaks', noDeckControls = false, children }) {
  const [open, setOpen] = React.useState(false);
  const dragRef = React.useRef(null);
  // Auto-inject a rail toggle when a <deck-stage> is on the page. The
  // toggle drives the deck's per-viewer _railVisible via window message;
  // state is mirrored from the same localStorage key the deck reads so
  // the control reflects reality across reloads. The mechanism is the
  // message — authors who want custom placement can post it directly
  // and pass noDeckControls to suppress this one.
  const hasDeckStage = React.useMemo(
    () => typeof document !== 'undefined' && !!document.querySelector('deck-stage'),
    [],
  );
  // Hide the toggle until the host has actually enabled the rail (the
  // __omelette_rail_enabled window message, posted only when the
  // omelette_deck_rail_enabled flag is on for this user). The initial read
  // covers TweaksPanel mounting after the message already arrived; the
  // listener covers the common case of mounting first.
  const [railEnabled, setRailEnabled] = React.useState(
    () => hasDeckStage && !!document.querySelector('deck-stage')?._railEnabled,
  );
  React.useEffect(() => {
    if (!hasDeckStage || railEnabled) return undefined;
    const onMsg = (e) => {
      if (e.data && e.data.type === '__omelette_rail_enabled') setRailEnabled(true);
    };
    window.addEventListener('message', onMsg);
    return () => window.removeEventListener('message', onMsg);
  }, [hasDeckStage, railEnabled]);
  const [railVisible, setRailVisible] = React.useState(() => {
    try { return localStorage.getItem('deck-stage.railVisible') !== '0'; } catch (e) { return true; }
  });
  const toggleRail = (on) => {
    setRailVisible(on);
    window.postMessage({ type: '__deck_rail_visible', on }, '*');
  };
  const offsetRef = React.useRef({ x: 16, y: 16 });
  const PAD = 16;

  const clampToViewport = React.useCallback(() => {
    const panel = dragRef.current;
    if (!panel) return;
    const w = panel.offsetWidth, h = panel.offsetHeight;
    const maxRight = Math.max(PAD, window.innerWidth - w - PAD);
    const maxBottom = Math.max(PAD, window.innerHeight - h - PAD);
    offsetRef.current = {
      x: Math.min(maxRight, Math.max(PAD, offsetRef.current.x)),
      y: Math.min(maxBottom, Math.max(PAD, offsetRef.current.y)),
    };
    panel.style.right = offsetRef.current.x + 'px';
    panel.style.bottom = offsetRef.current.y + 'px';
  }, []);

  React.useEffect(() => {
    if (!open) return;
    clampToViewport();
    if (typeof ResizeObserver === 'undefined') {
      window.addEventListener('resize', clampToViewport);
      return () => window.removeEventListener('resize', clampToViewport);
    }
    const ro = new ResizeObserver(clampToViewport);
    ro.observe(document.documentElement);
    return () => ro.disconnect();
  }, [open, clampToViewport]);

  React.useEffect(() => {
    const onMsg = (e) => {
      const t = e?.data?.type;
      if (t === '__activate_edit_mode') setOpen(true);
      else if (t === '__deactivate_edit_mode') setOpen(false);
    };
    window.addEventListener('message', onMsg);
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');
    return () => window.removeEventListener('message', onMsg);
  }, []);

  const dismiss = () => {
    setOpen(false);
    window.parent.postMessage({ type: '__edit_mode_dismissed' }, '*');
  };

  const onDragStart = (e) => {
    const panel = dragRef.current;
    if (!panel) return;
    const r = panel.getBoundingClientRect();
    const sx = e.clientX, sy = e.clientY;
    const startRight = window.innerWidth - r.right;
    const startBottom = window.innerHeight - r.bottom;
    const move = (ev) => {
      offsetRef.current = {
        x: startRight - (ev.clientX - sx),
        y: startBottom - (ev.clientY - sy),
      };
      clampToViewport();
    };
    const up = () => {
      window.removeEventListener('mousemove', move);
      window.removeEventListener('mouseup', up);
    };
    window.addEventListener('mousemove', move);
    window.addEventListener('mouseup', up);
  };

  if (!open) return null;
  return (
    <>
      <style>{__TWEAKS_STYLE}</style>
      <div ref={dragRef} className="twk-panel" data-noncommentable=""
           style={{ right: offsetRef.current.x, bottom: offsetRef.current.y }}>
        <div className="twk-hd" onMouseDown={onDragStart}>
          <b>{title}</b>
          <button className="twk-x" aria-label="Close tweaks"
                  onMouseDown={(e) => e.stopPropagation()}
                  onClick={dismiss}>✕</button>
        </div>
        <div className="twk-body">
          {children}
          {hasDeckStage && railEnabled && !noDeckControls && (
            <TweakSection label="Deck">
              <TweakToggle label="Thumbnail rail" value={railVisible} onChange={toggleRail} />
            </TweakSection>
          )}
        </div>
      </div>
    </>
  );
}

// ── Layout helpers ──────────────────────────────────────────────────────────

function TweakSection({ label, children }) {
  return (
    <>
      <div className="twk-sect">{label}</div>
      {children}
    </>
  );
}

function TweakRow({ label, value, children, inline = false }) {
  return (
    <div className={inline ? 'twk-row twk-row-h' : 'twk-row'}>
      <div className="twk-lbl">
        <span>{label}</span>
        {value != null && <span className="twk-val">{value}</span>}
      </div>
      {children}
    </div>
  );
}

// ── Controls ────────────────────────────────────────────────────────────────

function TweakSlider({ label, value, min = 0, max = 100, step = 1, unit = '', onChange }) {
  return (
    <TweakRow label={label} value={`${value}${unit}`}>
      <input type="range" className="twk-slider" min={min} max={max} step={step}
             value={value} onChange={(e) => onChange(Number(e.target.value))} />
    </TweakRow>
  );
}

function TweakToggle({ label, value, onChange }) {
  return (
    <div className="twk-row twk-row-h">
      <div className="twk-lbl"><span>{label}</span></div>
      <button type="button" className="twk-toggle" data-on={value ? '1' : '0'}
              role="switch" aria-checked={!!value}
              onClick={() => onChange(!value)}><i /></button>
    </div>
  );
}

function TweakRadio({ label, value, options, onChange }) {
  const trackRef = React.useRef(null);
  const [dragging, setDragging] = React.useState(false);
  // The active value is read by pointer-move handlers attached for the lifetime
  // of a drag — ref it so a stale closure doesn't fire onChange for every move.
  const valueRef = React.useRef(value);
  valueRef.current = value;

  // Segments wrap mid-word once per-segment width runs out. The track is
  // ~248px (280 panel − 28 body pad − 4 seg pad), each button loses 12px
  // to its own padding, and 11.5px system-ui averages ~6.3px/char — so 2
  // options fit ~16 chars each, 3 fit ~10. Past that (or >3 options), fall
  // back to a dropdown rather than wrap.
  const labelLen = (o) => String(typeof o === 'object' ? o.label : o).length;
  const maxLen = options.reduce((m, o) => Math.max(m, labelLen(o)), 0);
  const fitsAsSegments = maxLen <= ({ 2: 16, 3: 10 }[options.length] ?? 0);
  if (!fitsAsSegments) {
    // <select> emits strings — map back to the original option value so the
    // fallback stays type-preserving (numbers, booleans) like the segment path.
    const resolve = (s) => {
      const m = options.find((o) => String(typeof o === 'object' ? o.value : o) === s);
      return m === undefined ? s : typeof m === 'object' ? m.value : m;
    };
    return <TweakSelect label={label} value={value} options={options}
                        onChange={(s) => onChange(resolve(s))} />;
  }
  const opts = options.map((o) => (typeof o === 'object' ? o : { value: o, label: o }));
  const idx = Math.max(0, opts.findIndex((o) => o.value === value));
  const n = opts.length;

  const segAt = (clientX) => {
    const r = trackRef.current.getBoundingClientRect();
    const inner = r.width - 4;
    const i = Math.floor(((clientX - r.left - 2) / inner) * n);
    return opts[Math.max(0, Math.min(n - 1, i))].value;
  };

  const onPointerDown = (e) => {
    setDragging(true);
    const v0 = segAt(e.clientX);
    if (v0 !== valueRef.current) onChange(v0);
    const move = (ev) => {
      if (!trackRef.current) return;
      const v = segAt(ev.clientX);
      if (v !== valueRef.current) onChange(v);
    };
    const up = () => {
      setDragging(false);
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };

  return (
    <TweakRow label={label}>
      <div ref={trackRef} role="radiogroup" onPointerDown={onPointerDown}
           className={dragging ? 'twk-seg dragging' : 'twk-seg'}>
        <div className="twk-seg-thumb"
             style={{ left: `calc(2px + ${idx} * (100% - 4px) / ${n})`,
                      width: `calc((100% - 4px) / ${n})` }} />
        {opts.map((o) => (
          <button key={o.value} type="button" role="radio" aria-checked={o.value === value}>
            {o.label}
          </button>
        ))}
      </div>
    </TweakRow>
  );
}

function TweakSelect({ label, value, options, onChange }) {
  return (
    <TweakRow label={label}>
      <select className="twk-field" value={value} onChange={(e) => onChange(e.target.value)}>
        {options.map((o) => {
          const v = typeof o === 'object' ? o.value : o;
          const l = typeof o === 'object' ? o.label : o;
          return <option key={v} value={v}>{l}</option>;
        })}
      </select>
    </TweakRow>
  );
}

function TweakText({ label, value, placeholder, onChange }) {
  return (
    <TweakRow label={label}>
      <input className="twk-field" type="text" value={value} placeholder={placeholder}
             onChange={(e) => onChange(e.target.value)} />
    </TweakRow>
  );
}

function TweakNumber({ label, value, min, max, step = 1, unit = '', onChange }) {
  const clamp = (n) => {
    if (min != null && n < min) return min;
    if (max != null && n > max) return max;
    return n;
  };
  const startRef = React.useRef({ x: 0, val: 0 });
  const onScrubStart = (e) => {
    e.preventDefault();
    startRef.current = { x: e.clientX, val: value };
    const decimals = (String(step).split('.')[1] || '').length;
    const move = (ev) => {
      const dx = ev.clientX - startRef.current.x;
      const raw = startRef.current.val + dx * step;
      const snapped = Math.round(raw / step) * step;
      onChange(clamp(Number(snapped.toFixed(decimals))));
    };
    const up = () => {
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };
  return (
    <div className="twk-num">
      <span className="twk-num-lbl" onPointerDown={onScrubStart}>{label}</span>
      <input type="number" value={value} min={min} max={max} step={step}
             onChange={(e) => onChange(clamp(Number(e.target.value)))} />
      {unit && <span className="twk-num-unit">{unit}</span>}
    </div>
  );
}

// Relative-luminance contrast pick — checkmarks drawn over a swatch need to
// read on both #111 and #fafafa without per-option configuration. Hex input
// only (#rgb / #rrggbb); named or rgb()/hsl() colors fall through to "light".
function __twkIsLight(hex) {
  const h = String(hex).replace('#', '');
  const x = h.length === 3 ? h.replace(/./g, (c) => c + c) : h.padEnd(6, '0');
  const n = parseInt(x.slice(0, 6), 16);
  if (Number.isNaN(n)) return true;
  const r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
  return r * 299 + g * 587 + b * 114 > 148000;
}

const __TwkCheck = ({ light }) => (
  <svg viewBox="0 0 14 14" aria-hidden="true">
    <path d="M3 7.2 5.8 10 11 4.2" fill="none" strokeWidth="2.2"
          strokeLinecap="round" strokeLinejoin="round"
          stroke={light ? 'rgba(0,0,0,.78)' : '#fff'} />
  </svg>
);

// TweakColor — curated color/palette picker. Each option is either a single
// hex string or an array of 1-5 hex strings; the card adapts — a lone color
// renders solid, a palette renders colors[0] as the hero (left ~2/3) with the
// rest stacked in a sharp column on the right. onChange emits the
// option in the shape it was passed (string stays string, array stays array).
// Without options it falls back to the native color input for back-compat.
function TweakColor({ label, value, options, onChange }) {
  if (!options || !options.length) {
    return (
      <div className="twk-row twk-row-h">
        <div className="twk-lbl"><span>{label}</span></div>
        <input type="color" className="twk-swatch" value={value}
               onChange={(e) => onChange(e.target.value)} />
      </div>
    );
  }
  // Native <input type=color> emits lowercase hex per the HTML spec, so
  // compare case-insensitively. String() guards JSON.stringify(undefined),
  // which returns the primitive undefined (no .toLowerCase).
  const key = (o) => String(JSON.stringify(o)).toLowerCase();
  const cur = key(value);
  return (
    <TweakRow label={label}>
      <div className="twk-chips" role="radiogroup">
        {options.map((o, i) => {
          const colors = Array.isArray(o) ? o : [o];
          const [hero, ...rest] = colors;
          const sup = rest.slice(0, 4);
          const on = key(o) === cur;
          return (
            <button key={i} type="button" className="twk-chip" role="radio"
                    aria-checked={on} data-on={on ? '1' : '0'}
                    aria-label={colors.join(', ')} title={colors.join(' · ')}
                    style={{ background: hero }}
                    onClick={() => onChange(o)}>
              {sup.length > 0 && (
                <span>
                  {sup.map((c, j) => <i key={j} style={{ background: c }} />)}
                </span>
              )}
              {on && <__TwkCheck light={__twkIsLight(hero)} />}
            </button>
          );
        })}
      </div>
    </TweakRow>
  );
}

function TweakButton({ label, onClick, secondary = false }) {
  return (
    <button type="button" className={secondary ? 'twk-btn secondary' : 'twk-btn'}
            onClick={onClick}>{label}</button>
  );
}

Object.assign(window, {
  useTweaks, TweaksPanel, TweakSection, TweakRow,
  TweakSlider, TweakToggle, TweakRadio, TweakSelect,
  TweakText, TweakNumber, TweakColor, TweakButton,
});

function adaptBazi(b) {
  if (!b) return null;
  const keys = ["year", "month", "day", "hour"];
  const labelsCn = ["年柱", "月柱", "日柱", "时柱"];
  const labelsEn = ["Year", "Month", "Day", "Hour"];
  const pillars = keys.map((k, i) => {
    const p = b[`${k}_pillar`] || {};
    const yy = STEM_YIN_YANG[p.stem] || "";
    const elEn = FIVE_PHASES_EN[p.wuxing_stem] || "";
    return {
      label: labelsCn[i], labelEn: labelsEn[i],
      stem: p.stem || "?", branch: p.branch || "?",
      stemPinyin: STEM_PINYIN[p.stem] || "", branchPinyin: BRANCH_PINYIN[p.branch] || "",
      element: p.wuxing_stem || "?",
      phase: `${yy} ${elEn}${k === "day" ? " · day master" : ""}`.trim(),
      hidden: (b.hidden_stems || {})[k] || [],
      master: k === "day",
    };
  });
  const cur = new Date().getFullYear();
  const daYun = (b.da_yun || []).slice(0, 6).map(d => ({
    age: String(Math.round(d.age_start || 0)),
    ganzhi: d.ganzhi || `${d.stem || ""}${d.branch || ""}`,
    current: cur >= (d.year_start || 0) && cur < (d.year_end || 0),
  }));
  const dmEl = b.day_pillar?.wuxing_stem || "";
  return {
    pillars, daYun,
    master: `${b.day_master || ""}${dmEl}`,
    pattern: b.pattern || "—",
    patternEn: PATTERN_EN_MAP[b.pattern] || "",
    yongShen: b.yong_shen || "—",
    yongShenEn: (FIVE_PHASES_EN[b.yong_shen] || "").replace(/^./, c => c.toUpperCase()),
    shenSha: (b.shen_sha || []).slice(0, 6),
    fiveElements: b.five_elements || { 木:0, 火:0, 土:0, 金:0, 水:0 },
  };
}

function adaptZiwei(z) {
  if (!z) return null;
  const lifeP = (z.palaces || []).find(p => p?.name === z.life_palace) || (z.palaces || [])[0] || {};
  const bodyP = (z.palaces || []).find(p => p?.name === z.body_palace) || {};
  return {

    shen: bodyP.branch ? `${bodyP.branch}宫` : (z.body_palace || "—"),
    zhuxing: (lifeP.stars || []).slice(0, 3),

    },
    palaces: z.palaces || [],
    lifePalaceName: z.life_palace || "命宫",
  };
}

function adaptAstro(a) {
  if (!a) return null;
  const angles = a.angles || {};
  const planets = a.planets || {};
  const order = ["sun","moon","mercury","venus","mars","jupiter","saturn","uranus","neptune","pluto"];
  const bodies = order
    .filter(k => planets[k])
    .map(k => {
      const p = planets[k];
      return {
        name: PLANET_NAME_CN[k] || k,
        glyph: PLANET_GLYPH_MAP[k] || "",
        sign: p.sign_en || (p.sign || "").replace("座", ""),
        deg: p.sign_degree || 0,
        house: p.house || 1,
        longitude: p.longitude || 0,
      };
    });
  const sunB = bodies.find(b => b.name === "Sun");
  const moonB = bodies.find(b => b.name === "Moon");
  const ascSignIdx = Math.floor(((angles.ASC || 0) % 360) / 30);
  const mcSignIdx = Math.floor(((angles.MC || 0) % 360) / 30);
  return {
    sun:  sunB  || { sign:"—", deg:0, glyph:"☉" },
    moon: moonB || { sign:"—", deg:0, glyph:"☾" },
    asc:  { sign: SIGN_EN[ascSignIdx] || "—", deg: (angles.ASC || 0) % 30, glyph: "⇧" },
    mc:   { sign: SIGN_EN[mcSignIdx]  || "—", deg: (angles.MC  || 0) % 30, glyph: "⇧" },
    phase: a.moon_phase || "—",
    bodies,
    aspects: (a.aspects || []).slice(0, 6).map(asp => ({
      a: PLANET_NAME_CN[asp.planet_a] || asp.planet_a || "",
      b: PLANET_NAME_CN[asp.planet_b] || asp.planet_b || "",
      type: asp.aspect_type || asp.type || "",
      orb: Number((asp.orb || 0).toFixed(1)),
    })),
  };
}

function adaptNumer(n) {

    life: n.life_path || 0,

    soul: n.soul_urge || 0,

}

                <circle cx={rPlanet} cy={0} r={14} fill={color} fillOpacity="0.18" filter="url(#aw-glow)" />
                {/* body */}
                <circle cx={rPlanet} cy={0} r={11}
                  fill="var(--paper)"
                  stroke={color} strokeWidth="1.4"
                  style={{ animation: `planet-breathe ${4 + i*0.3}s ease-in-out infinite`, transformOrigin: `${rPlanet}px 0px` }} />
                {/* glyph */}
                <text x={rPlanet} y={0} fontSize={14} fill={color}
                  textAnchor="middle" dominantBaseline="central"
                  fontFamily="var(--serif-en)" fontWeight="600">{b.glyph}</text>
                {/* 度数小标 */}
                <text x={rPlanet} y={20} fontSize={8.5} fill="var(--ink-3)"
                  textAnchor="middle" fontFamily="var(--mono)" letterSpacing="0.04em">
                  {Math.round(b.deg)}°
                </text>
              </g>
            </g>
          );
        })}

        {/* 中心朱砂脉冲（合议焦点） */}
        <circle cx={cx} cy={cy} r={5} fill="var(--cinnabar)"
          style={{ animation: "pulse-r 2.5s ease-in-out infinite" }} />
        <circle cx={cx} cy={cy} r={1.5} fill="var(--paper)" />
      </svg>
    </div>
  );
}

// Bagua (八卦) — 8 trigrams arranged in a circle, slowly rotating
function AnimatedBagua({ size = 280 }) {
  const trigrams = [
    { name: "乾", lines: [1,1,1] }, { name: "兑", lines: [1,1,0] },
    { name: "离", lines: [1,0,1] }, { name: "震", lines: [1,0,0] },
    { name: "巽", lines: [0,1,1] }, { name: "坎", lines: [0,1,0] },
    { name: "艮", lines: [0,0,1] }, { name: "坤", lines: [0,0,0] },
  ];
  const r = size / 2;
  return (
    <div style={{ position: "relative", width: size, height: size }}>
      <style>{`
        @keyframes bagua-spin { to { transform: rotate(360deg); } }
        @keyframes taiji-spin { to { transform: rotate(-360deg); } }
      `}</style>
      <svg width={size} height={size} viewBox={`0 0 ${size} ${size}`}
        style={{ animation: "bagua-spin 90s linear infinite", transformOrigin: "center" }}>
        <circle cx={r} cy={r} r={r - 4} fill="none" stroke="var(--ink)" strokeOpacity="0.25" />
        {trigrams.map((t, i) => {
          const angle = (i * 45 - 90);
          const a = angle * Math.PI / 180;
          const cx = r + Math.cos(a) * (r - 30);
          const cy = r + Math.sin(a) * (r - 30);
          return (
            <g key={i} transform={`translate(${cx},${cy}) rotate(${angle + 90})`}>
              {t.lines.map((line, j) => (
                line === 1
                  ? <rect key={j} x={-14} y={-12 + j * 7} width={28} height={3} fill="var(--ink)" />
                  : <g key={j}>
                      <rect x={-14} y={-12 + j * 7} width={11} height={3} fill="var(--ink)" />
                      <rect x={3}   y={-12 + j * 7} width={11} height={3} fill="var(--ink)" />
                    </g>
              ))}
            </g>
          );
        })}
      </svg>
      {/* Taiji center (yin-yang style — counter rotating) */}
      <svg width={size * 0.32} height={size * 0.32}
        viewBox="0 0 100 100"
        style={{
          position: "absolute", left: "50%", top: "50%",
          transform: "translate(-50%, -50%)",
          animation: "taiji-spin 14s linear infinite",
          transformOrigin: "center",
        }}>
        <circle cx="50" cy="50" r="48" fill="var(--paper)" stroke="var(--ink)" strokeWidth="1.5" />
        <path d="M50 2 A 48 48 0 0 1 50 98 A 24 24 0 0 1 50 50 A 24 24 0 0 0 50 2 Z" fill="var(--ink)" />
        <circle cx="50" cy="26" r="5" fill="var(--paper)" />
        <circle cx="50" cy="74" r="5" fill="var(--cinnabar)" />

}

// Hexagram — 6 horizontal lines drawing in

// Drifting glyph cloud — calligraphic CN characters drifting + fading
function GlyphCloud({ chars = ["乾","坤","坎","离","震","巽","艮","兑","禄","权","科","忌"], count = 14 }) {
  const items = useMemo(() => Array.from({ length: count }, (_, i) => ({
    char: chars[i % chars.length],
    x: Math.random() * 100, y: Math.random() * 100,
    size: 22 + Math.random() * 60,
    dur: 18 + Math.random() * 20,
    delay: Math.random() * -20,
    op: 0.04 + Math.random() * 0.07,
  })), [count]);
  return (
    <div style={{ position: "absolute", inset: 0, overflow: "hidden", pointerEvents: "none" }}>
      <style>{`
        @keyframes drift { 0% { transform: translateY(20px); opacity: 0; } 15% { opacity: 1; } 85% { opacity: 1; } 100% { transform: translateY(-40px); opacity: 0; } }
      `}</style>
      {items.map((it, i) => (
        <span key={i} style={{
          position: "absolute", left: `${it.x}%`, top: `${it.y}%`,
          fontFamily: "var(--serif-cn)", fontWeight: 700,
          fontSize: it.size, color: "var(--ink)", opacity: it.op,
          animation: `drift ${it.dur}s ${it.delay}s ease-in-out infinite`,
          userSelect: "none",
        }}>{it.char}</span>
      ))}
    </div>
  );
}

// MysticalCompute — ONE unified gesture: an enso circle slowly drawn, with 8 quiet
// expert markers along its rim and a breathing taiji at center. No chaos.
function MysticalCompute({ phase, expertState }) {
  const size = 440;
  const cx = size / 2, cy = size / 2;
  const rOuter = 178;
  const rMarker = 178;
  const rLabel = 208;
  return (
    <div style={{ position: "relative", width: "100%", padding: "32px 0 24px", borderTop: "var(--rule)", borderBottom: "var(--rule)", display: "flex", flexDirection: "column", alignItems: "center", gap: 18 }}>
      <style>{`
        @keyframes mc-enso { from { stroke-dashoffset: 1200; } to { stroke-dashoffset: 0; } }
        @keyframes mc-breathe { 0%,100% { transform: scale(1); opacity: 0.92; } 50% { transform: scale(1.04); opacity: 1; } }
        @keyframes mc-rotate { to { transform: rotate(360deg); } }
        @keyframes mc-fadein { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes mc-pulsedot { 0%,100% { transform: scale(1); } 50% { transform: scale(1.35); } }
      `}</style>

      <div style={{ position: "relative", width: size, height: size }}>
        <svg width={size} height={size} viewBox={`0 0 ${size} ${size}`} style={{ position: "absolute", inset: 0 }}>
          {/* faint guide circle */}
          <circle cx={cx} cy={cy} r={rOuter} fill="none" stroke="var(--ink)" strokeOpacity="0.06" />
          {/* enso — single ink stroke being drawn */}
          <circle cx={cx} cy={cy} r={rOuter} fill="none"
            stroke="var(--ink)" strokeWidth="1.5" strokeLinecap="round"
            strokeDasharray="1200" strokeDashoffset="1200"
            style={{ transformOrigin: "center", transform: "rotate(-90deg)", animation: "mc-enso 3.6s cubic-bezier(.22,1,.36,1) forwards" }} />
          {/* 8 hairline radial spokes, very faint */}
          {Array.from({ length: 8 }).map((_, i) => {
            const a = (i * 45 - 90) * Math.PI / 180;
            return <line key={i}
              x1={cx + Math.cos(a) * 60} y1={cy + Math.sin(a) * 60}
              x2={cx + Math.cos(a) * (rOuter - 6)} y2={cy + Math.sin(a) * (rOuter - 6)}
              stroke="var(--ink)" strokeOpacity="0.05" />;
          })}
        </svg>

        {/* 8 expert markers along the rim */}
        {EXPERTS.map((ex, i) => {
          const a = (i * 45 - 90) * Math.PI / 180;
          const x = cx + Math.cos(a) * rMarker;
          const y = cy + Math.sin(a) * rMarker;
          const lx = cx + Math.cos(a) * rLabel;
          const ly = cy + Math.sin(a) * rLabel;
          const st = (expertState && expertState[ex.id]) ? expertState[ex.id].status : "idle";
          const done = st === "done";
          const thinking = st === "thinking";
          return (
            <React.Fragment key={ex.id}>
              {/* dot */}
              <div style={{
                position: "absolute", left: x - 5, top: y - 5,
                width: 10, height: 10, borderRadius: "50%",
                background: done ? "var(--cinnabar)" : "var(--paper)",
                border: `1px solid ${done ? "var(--cinnabar)" : (thinking ? "var(--ink)" : "color-mix(in oklch, var(--ink) 25%, transparent)")}`,
                animation: thinking ? "mc-pulsedot 1.6s ease-in-out infinite" : "none",
                transition: "background 0.5s ease, border-color 0.5s ease",
              }} />
              {/* label */}
              <div style={{
                position: "absolute",
                left: lx, top: ly,
                transform: "translate(-50%, -50%)",
                fontFamily: "var(--serif-cn)", fontSize: 13, fontWeight: 600,
                color: done ? "var(--cinnabar)" : (thinking ? "var(--ink)" : "var(--ink-3)"),
                opacity: 0,
                animation: `mc-fadein 0.6s ${0.4 + i * 0.08}s ease-out forwards`,
                whiteSpace: "nowrap",
                letterSpacing: "0.05em",
                transition: "color 0.5s ease",
              }}>{ex.cn}</div>
            </React.Fragment>
          );
        })}

        {/* center: breathing taiji */}
        <div style={{
          position: "absolute", left: "50%", top: "50%",
          transform: "translate(-50%, -50%)",
          width: 84, height: 84,
          animation: "mc-breathe 5s ease-in-out infinite",
        }}>
          <svg width="84" height="84" viewBox="0 0 100 100" style={{ animation: "mc-rotate 24s linear infinite", transformOrigin: "center" }}>
            <circle cx="50" cy="50" r="48" fill="var(--paper)" stroke="var(--ink)" strokeWidth="1" />
            <path d="M50 2 A 48 48 0 0 1 50 98 A 24 24 0 0 1 50 50 A 24 24 0 0 0 50 2 Z" fill="var(--ink)" />
            <circle cx="50" cy="26" r="4" fill="var(--paper)" />
            <circle cx="50" cy="74" r="4" fill="var(--cinnabar)" />
          </svg>
        </div>
      </div>

      {/* phase line — single quiet line below the circle */}
      <div style={{ display: "flex", alignItems: "baseline", gap: 16, opacity: 0, animation: "mc-fadein 0.6s 0.2s ease-out forwards" }}>
        <span className="caps" style={{ fontSize: 10, color: "var(--cinnabar)", letterSpacing: "0.22em" }}>推演</span>
        <span style={{ fontFamily: "var(--serif-cn)", fontSize: 20, fontWeight: 600, letterSpacing: "0.04em" }}>

          {phase ? phase.en : ""}
        </span>
      </div>
    </div>
  );
}

// Five elements bar
function FiveElementsBar({ data }) {

          </div>
        );
      })}
    </div>

}

// Astrology wheel — minimal, hand-grid style
function AstroWheel({ size = 360, data }) {
  const r = size / 2;
  const cx = r, cy = r;
  const rOuter = r - 6;
  const rInner = r - 60;
  const rPlanet = r - 36;

  const houses = Array.from({ length: 12 }, (_, i) => i);

  return (
    <svg width={size} height={size} viewBox={`0 0 ${size} ${size}`} style={{ display: "block" }}>
      {/* outer ring */}
      <circle cx={cx} cy={cy} r={rOuter} fill="none" stroke="currentColor" strokeOpacity="0.25" />
      <circle cx={cx} cy={cy} r={rInner} fill="none" stroke="currentColor" strokeOpacity="0.18" />
      <circle cx={cx} cy={cy} r={rInner - 60} fill="none" stroke="currentColor" strokeOpacity="0.12" />
      {/* house spokes */}
      {houses.map(i => {
        const a = (i * 30) * Math.PI / 180;
        const x1 = cx + Math.cos(a) * rInner;
        const y1 = cy + Math.sin(a) * rInner;
        const x2 = cx + Math.cos(a) * rOuter;
        const y2 = cy + Math.sin(a) * rOuter;
        return <line key={i} x1={x1} y1={y1} x2={x2} y2={y2} stroke="currentColor" strokeOpacity="0.25" />;
      })}
      {/* sign labels (zodiac glyphs) */}
      {["♈","♉","♊","♋","♌","♍","♎","♏","♐","♑","♒","♓"].map((g, i) => {
        const a = (i * 30 + 15 - 90) * Math.PI / 180;
        const lx = cx + Math.cos(a) * (rOuter - 30);
        const ly = cy + Math.sin(a) * (rOuter - 30);
        return (
          <text key={i} x={lx} y={ly} fontSize={14} fill="currentColor" fillOpacity="0.55"
                textAnchor="middle" dominantBaseline="central" fontFamily="var(--serif-en)">{g}</text>
        );
      })}
      {/* aspect lines (cross center) */}
      {data.aspects.map((asp, i) => {
        const A = data.bodies.find(b => b.name === asp.a);
        const B = data.bodies.find(b => b.name === asp.b);
        if (!A || !B) return null;
        const aa = (A.longitude - 90) * Math.PI / 180;
        const ab = (B.longitude - 90) * Math.PI / 180;
        const ax = cx + Math.cos(aa) * (rInner - 60);
        const ay = cy + Math.sin(aa) * (rInner - 60);
        const bx = cx + Math.cos(ab) * (rInner - 60);
        const by = cy + Math.sin(ab) * (rInner - 60);
        const stroke = asp.type === "trine" ? "var(--cinnabar)" : asp.type === "square" ? "currentColor" : "var(--gild)";
        const dash = asp.type === "opposition" ? "4 3" : "0";
        return <line key={i} x1={ax} y1={ay} x2={bx} y2={by} stroke={stroke} strokeOpacity="0.55" strokeDasharray={dash} strokeWidth="0.8" />;
      })}
      {/* planet glyphs */}
      {data.bodies.map((b, i) => {
        const a = (b.longitude - 90) * Math.PI / 180;
        const px = cx + Math.cos(a) * rPlanet;
        const py = cy + Math.sin(a) * rPlanet;
        return (
          <g key={b.name}>
            <circle cx={px} cy={py} r={11} fill="var(--paper)" stroke="currentColor" strokeOpacity="0.6" />
            <text x={px} y={py} fontSize={13} fill="currentColor" textAnchor="middle" dominantBaseline="central" fontFamily="var(--serif-en)">{b.glyph}</text>
          </g>
        );
      })}
      {/* center seal-like dot */}
      <circle cx={cx} cy={cy} r={3} fill="var(--cinnabar)" />
    </svg>
  );
}

        </div>

window.ChartScreen = ChartScreen;

  </script>

  <script type="text/babel">
// Chat — animated SSE streaming consultation
// Map backend action types → UI phase {id, cn, en}
const PHASE_MAP = {
  planner_start:    { id: "start",    cn: "起 · 立档读题", en: "Start" },
  planner_thinking: { id: "thinking", cn: "思 · 思考下一步", en: "Thinking" },
  compute_chart:    { id: "compute",  cn: "排盘 · 本地纯算法", en: "Compute charts" },
  auto_compute:    { id: "compute",  cn: "排盘 · 自动补算", en: "Auto-compute" },
  consult_expert:  { id: "expert",   cn: "请教 · 单专家深算", en: "Consult expert" },
  cross_link:      { id: "cross",    cn: "联 · 中西交叉", en: "Cross-link" },
  reflect:         { id: "reflect",  cn: "镜 · VRP 反思", en: "Reflect" },
  synthesize:      { id: "synth",    cn: "综 · 小综合 / 对齐", en: "Synthesize" },
  ask_user:        { id: "ask",      cn: "问 · 反问澄清", en: "Clarify" },
  narrative_start: { id: "narr",     cn: "述 · 撰写叙事", en: "Narrative" },
};

// Map backend expert names → UI EXPERTS id
const EXPERT_ID_MAP = { numerology: "numero" };
const normExpertId = (e) => EXPERT_ID_MAP[e] || e;

const initExpertState = () => {
  const out = {};
  EXPERTS.forEach(ex => { out[ex.id] = { status: "idle", claim: null }; });
  return out;
};

function ChatScreen({ go, animSpeed = 1, profile, question }) {
  const p = profile || SAMPLE_PROFILE;
  const q = question || SAMPLE_QUESTION;
  const [, time] = (p.birth || "").split(" ");
  const sc = SCENARIO_MAP[p.scenario] || SCENARIO_MAP.general;

  const [running, setRunning]       = useState(false);
  const [done, setDone]             = useState(false);
  const [error, setError]           = useState(null);
  const [sessionId, setSessionId]   = useState(null);

  const [currentPhase, setCurrentPhase] = useState(null);
  const [expertState, setExpertState]   = useState(initExpertState);
  const [synthList, setSynthList]       = useState([]); // [{sys: "cn"|"wt", text}]
  const [align, setAlign]               = useState(null); // {consensus, divergence, complementary}
  const [verdict, setVerdict]           = useState(null); // {core, confidence}
  const [narrative, setNarrative]       = useState("");
  const [caveats, setCaveats]           = useState([]);
  const [askUserPrompt, setAskUserPrompt] = useState(null); // {question, why}
  const [askUserReply, setAskUserReply]   = useState("");
  const [eventLog, setEventLog]         = useState([]);   // raw events for sidebar trace

  // multi-turn follow-up state
  const [followUps, setFollowUps] = useState([]);   // [{q, status, narrative, verdict}]
  const [followUp, setFollowUp]   = useState("");
  const eventSourceRef = useRef(null);
  const activeFollowupIdxRef = useRef(-1); // -1 = main run; >=0 = follow-up index

  // Cleanup on unmount
  useEffect(() => () => { if (eventSourceRef.current) eventSourceRef.current.close(); }, []);

  // Push narrative chunk into the right target (main or follow-up)
  const appendNarrative = (chunk) => {
    const idx = activeFollowupIdxRef.current;
    if (idx < 0) {
      setNarrative(prev => prev + chunk);
    } else {
      setFollowUps(prev => prev.map((fu, i) => i === idx ? { ...fu, narrative: (fu.narrative || "") + chunk } : fu));
    }
  };
  const replaceNarrative = (text) => {
    const idx = activeFollowupIdxRef.current;
    if (idx < 0) setNarrative(text);
    else setFollowUps(prev => prev.map((fu, i) => i === idx ? { ...fu, narrative: text } : fu));
  };
  const setRunVerdict = (v) => {
    const idx = activeFollowupIdxRef.current;
    if (idx < 0) setVerdict(v);
    else setFollowUps(prev => prev.map((fu, i) => i === idx ? { ...fu, verdict: v } : fu));
  };

  // Listen to all known event types on the EventSource
  const wireEvents = (es) => {
    const log = (type, data) => setEventLog(prev => [...prev.slice(-200), { type, ...data, _t: Date.now() }]);
    const handlers = {
      planner_start:   (d) => { log("planner_start", d); setCurrentPhase(PHASE_MAP.planner_start); },
      input_caveats:   (d) => { log("input_caveats", d); setCaveats(d.caveats || []); },
      planner_thinking:(d) => { log("planner_thinking", d); setCurrentPhase(PHASE_MAP.planner_thinking); },
      planner_thought: (d) => { log("planner_thought", d); },
      planner_executing: (d) => {
        log("planner_executing", d);
        const phase = PHASE_MAP[d.action] || { id: d.action, cn: d.action, en: d.action };
        setCurrentPhase(phase);
        if (d.action === "consult_expert" && d.expert) {
          const eid = normExpertId(d.expert);
          setExpertState(prev => ({ ...prev, [eid]: { status: "thinking", claim: prev[eid]?.claim || null } }));
        }
      },
      chart_ready:     (d) => log("chart_ready", d),
      charts_summary:  (d) => log("charts_summary", d),
      expert_done: (d) => {
        log("expert_done", d);
        const eid = normExpertId(d.expert);
        setExpertState(prev => ({ ...prev, [eid]: { status: "done", claim: d.headline || d.summary || null } }));
      },
      cross_link_insight: (d) => log("cross_link_insight", d),
      reflection:         (d) => log("reflection", d),
      synth_done: (d) => {
        log("synth_done", d);
        if (d.is_skipped) return;
        const sys = d.group === "chinese" ? "cn" : "wt";
        setSynthList(prev => {
          if (prev.some(s => s.sys === sys)) return prev.map(s => s.sys === sys ? { sys, text: d.headline } : s);
          return [...prev, { sys, text: d.headline }];
        });
      },
      aligner_done: (d) => {
        log("aligner_done", d);
        const nT = d.n_topics || 0;
        const consensus = Math.round((d.consensus_score || 0) * nT);
        const divergence = Math.round((d.divergence_score || 0) * nT);
        setAlign({
          consensus,
          divergence,
          complementary: Math.max(0, nT - consensus - divergence),
          summary: d.summary,
        });
      },
      verdict_done: (d) => {
        log("verdict_done", d);
        const conf = (d.confidence || "").toString().toUpperCase();
        setRunVerdict({
          core: d.summary || (d.consensus || []).join("、") || "已合议",
          confidence: conf || "—",
        });
      },
      narrative_start: (d) => { log("narrative_start", d); setCurrentPhase(PHASE_MAP.narrative_start); },
      narrative_chunk: (d) => { log("narrative_chunk", { textLen: (d.text || "").length }); appendNarrative(d.text || ""); },
      narrative:       (d) => { log("narrative", { len: (d.text || "").length }); if (d.replaced) replaceNarrative(d.text || ""); },
      ask_user: (d) => {
        log("ask_user", d);
        setAskUserPrompt({ question: d.question || "请补充更多信息。", why: d.why || "" });
        setCurrentPhase(PHASE_MAP.ask_user);
      },
      waiting_user: (d) => log("waiting_user", d),
      user_replied: (d) => { log("user_replied", d); setAskUserPrompt(null); setAskUserReply(""); },
      done: (d) => {
        log("done", d);
        setDone(true);
        if (eventSourceRef.current) { eventSourceRef.current.close(); eventSourceRef.current = null; }
        // mark follow-up as done if active
        const idx = activeFollowupIdxRef.current;
        if (idx >= 0) setFollowUps(prev => prev.map((fu, i) => i === idx ? { ...fu, status: "done" } : fu));
      },
      error: (d) => {
        log("error", d);
        setError(d.message || "未知错误");
        if (eventSourceRef.current) { eventSourceRef.current.close(); eventSourceRef.current = null; }
      },
      action_error: (d) => log("action_error", d),
      planner_max_steps: (d) => log("planner_max_steps", d),
    };
    Object.keys(handlers).forEach(type => {
      es.addEventListener(type, (msgEvent) => {
        try { handlers[type](JSON.parse(msgEvent.data)); }
        catch (err) { console.error("SSE handler", type, err); }
      });
    });
    es.onerror = () => {
      if (es.readyState === EventSource.CLOSED) return; // normal close
      console.error("SSE connection error");
      setError("连接中断");
    };
  };

  // Convert UI profile shape → backend session shape
  const buildSessionPayload = () => ({
    id: sessionId || undefined,
    name: p.name,
    gender: p.gender === "女" ? "female" : p.gender === "男" ? "male" : "other",
    date: (p.birth || "").split(" ")[0] || "",
    time: (p.birth || "").split(" ")[1] || "",
    unknownTime: false,
    place: p.place,
    timezone_offset: 8.0,
    scenario: "chat",
    question: q,
  });

  // First run: create session + post initial question + open stream
  const startRun = async () => {
    setRunning(true); setDone(false); setError(null);
    setCurrentPhase(null); setExpertState(initExpertState());
    setSynthList([]); setAlign(null); setVerdict(null); setNarrative("");
    setCaveats([]); setAskUserPrompt(null); setAskUserReply("");
    setEventLog([]); setFollowUps([]);
    activeFollowupIdxRef.current = -1;

    try {
      const sres = await fetch("/api/v1/sessions", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(buildSessionPayload()),
      });
      const sjson = await sres.json();
      const sid = sjson.session_id;
      setSessionId(sid);

      const es = new EventSource(`/api/v1/sessions/${sid}/stream`);
      eventSourceRef.current = es;
      wireEvents(es);

      // Post initial question (after stream opens so backend's queue.get is awaiting)
      await fetch(`/api/v1/sessions/${sid}/messages`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ text: q }),
      });
    } catch (err) {
      console.error(err);
      setError(err.message || "启动失败");
      setRunning(false);
    }
  };

  // Mid-cycle: user answers an ask_user prompt
  const submitAskUserReply = async () => {
    const txt = askUserReply.trim();
    if (!txt || !sessionId) return;
    try {
      await fetch(`/api/v1/sessions/${sessionId}/messages`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ text: txt }),
      });
      // ask_user UI clears on user_replied event

                </div>
              </div>
            </div>

                  rows={3}
                  value={followUp}

              const t0 = events[0]?._t || e._t;
              const sec = ((e._t - t0) / 1000).toFixed(2).padStart(6, "0");
              const accent = e.type === "verdict_done" || e.type === "planner_thought" || e.type === "ask_user";
              const detail =
                e.type === "planner_executing" ? `:${e.action || ""}${e.expert ? "/" + e.expert : ""}` :

                e.type === "synth_done" ? `:${e.group || ""}` :
                e.type === "chart_ready" ? `:${e.chart_type || ""}` :
                "";

                <div key={i} style={{ display: "flex", gap: 8, color: accent ? "var(--cinnabar)" : "var(--ink-2)" }}>

                  <span style={{ flex: 1 }}>{e.type}{detail}</span>

function Spinner() {

}

function ExpertCard({ ex, state }) {

    done:     { ring: "var(--ink)",        label: "成 · done",     labelColor: "var(--jade)" },

  const c = stateColors[state.status];
  return (
    <div style={{
      padding: 20,
      border: `1px solid ${c.ring}`,
      background: state.status === "thinking" ? "color-mix(in oklch, var(--cinnabar) 3%, transparent)" : "transparent",
      transition: "all .25s ease",
      position: "relative",
      minHeight: 120,

        <span className="caps" style={{ fontSize: 9, color: c.labelColor }}>
          {ex.sys === "cn" ? "中" : "西"} · {c.label}

      {state.status === "thinking" && (
        <div style={{ marginTop: 12, display: "flex", gap: 4 }}>
          {[0,1,2].map(i => <div key={i} style={{ width: 6, height: 6, borderRadius: "50%", background: "var(--cinnabar)", animation: `dot 1.2s ${i * 0.15}s infinite` }} />)}
          <style>{`@keyframes dot{0%,80%,100%{opacity:0.3}40%{opacity:1}}`}</style>
        </div>
      )}
      {state.claim && (
        <div style={{ marginTop: 14, fontFamily: "var(--serif-cn)", fontSize: 14, lineHeight: 1.7, color: "var(--ink-2)", textWrap: "pretty" }}>
          {state.claim}
        </div>
      )}
    </div>
  );
}

function SynthCard({ sys, text }) {
  return (
    <div style={{ padding: 24, border: "1px solid var(--ink)", position: "relative" }}>
      <div className="caps" style={{ fontSize: 10, color: sys === "cn" ? "var(--cinnabar)" : "var(--ink-3)" }}>

}

            <div style={{ fontFamily: "var(--serif-en)", fontSize: 88, fontWeight: 500, lineHeight: 1, color: x.color, marginTop: 6 }}>{x.n}</div>
            <div style={{ fontFamily: "var(--serif-cn)", fontWeight: 600, fontSize: 18, marginTop: 10 }}>{x.cn}</div>
            <div className="em" style={{ fontSize: 12, color: "var(--ink-3)", marginTop: 4 }}>{x.hint}</div>
          </div>

      </div>
      <div style={{ marginTop: 18, padding: 20, background: "color-mix(in oklch, var(--cinnabar) 4%, transparent)", borderLeft: "2px solid var(--cinnabar)" }}>
        <div className="caps" style={{ fontSize: 10, color: "var(--cinnabar)" }}>关键涌现 · EMERGENCE</div>

          中式"火旺喜金水" × 西式"9 宫木火远方" → <strong>以教育为本，以科技为器，以学问为远方</strong>。
        </div>
      </div>
    </div>
  );
}

function TarotGlyph({ kind, theme }) {
  // theme 可选；不传则用经典 ink/red/gild
  const main = (theme && theme.main) || "var(--ink-2)";
  const accent = (theme && theme.accent) || "var(--cinnabar)";
  const ink = (theme && theme.ink) || "var(--ink-2)";

  if (kind === "pentacle") return (

      <defs>
        <radialGradient id={`pg-${main}`}>
          <stop offset="0%" stopColor={accent} stopOpacity="0.18" />
          <stop offset="100%" stopColor={accent} stopOpacity="0" />
        </radialGradient>
      </defs>
      <circle cx="30" cy="30" r="22" fill={`url(#pg-${main})`} />
      <circle cx="30" cy="30" r="20" fill="none" stroke={main} strokeWidth="1.4" />
      <circle cx="30" cy="30" r="16" fill="none" stroke={main} strokeOpacity="0.4" strokeWidth="0.5" strokeDasharray="1 2" />
      {/* 五角星（朝上） */}
      <path d="M30 14 L34.7 25.4 L46.5 26.5 L37.6 34.3 L40.4 46 L30 39.6 L19.6 46 L22.4 34.3 L13.5 26.5 L25.3 25.4 Z"
        fill={accent} fillOpacity="0.16"
        stroke={accent} strokeWidth="1.4" strokeLinejoin="round" />
      <circle cx="30" cy="30" r="2.2" fill={accent} />
    </svg>
  );
  if (kind === "wheel") return (
    <svg viewBox="0 0 60 60" width="86%" style={{ maxWidth: 70 }}>
      <circle cx="30" cy="30" r="22" fill="none" stroke={main} strokeWidth="1.2" />
      <circle cx="30" cy="30" r="16" fill="none" stroke={main} strokeOpacity="0.5" strokeWidth="0.8" strokeDasharray="1 1.5" />
      <circle cx="30" cy="30" r="9" fill={accent} fillOpacity="0.18" stroke={accent} strokeWidth="0.8" />
      {/* 8 辐 */}
      {Array.from({length: 8}).map((_, i) => {
        const a = i * 45 * Math.PI / 180;
        const isMain = i % 2 === 0;
        return <line key={i}
          x1={30+Math.cos(a)*9} y1={30+Math.sin(a)*9}
          x2={30+Math.cos(a)*22} y2={30+Math.sin(a)*22}
          stroke={isMain ? main : accent} strokeOpacity={isMain ? 0.85 : 0.55}
          strokeWidth={isMain ? 1.1 : 0.7} />;
      })}
      <circle cx="30" cy="30" r="2.8" fill={accent} />
    </svg>
  );
  if (kind === "lantern") return (
    <svg viewBox="0 0 60 60" width="76%" style={{ maxWidth: 56 }}>
      <defs>
        <radialGradient id="lg" cx="50%" cy="40%">
          <stop offset="0%" stopColor={accent} stopOpacity="0.85" />
          <stop offset="60%" stopColor={accent} stopOpacity="0.18" />
          <stop offset="100%" stopColor={accent} stopOpacity="0" />
        </radialGradient>
      </defs>
      {/* 灯笼 */}
      <path d="M30 7 L34 16 L34.5 32 Q30 36 25.5 32 L26 16 Z"
        fill="var(--paper)" stroke={main} strokeWidth="1.1" strokeLinejoin="round" />
      {/* 灯火光晕 */}
      <ellipse cx="30" cy="22" rx="9" ry="11" fill="url(#lg)" />
      <circle cx="30" cy="22" r="3.2" fill={accent} />
      {/* 灯顶细线 */}
      <line x1="26" y1="11" x2="34" y2="11" stroke={main} strokeWidth="0.7" />
      {/* 灯柄 */}
      <line x1="30" y1="36" x2="30" y2="46" stroke={main} strokeWidth="1" />
      <path d="M22 47 Q30 54 38 47" fill="none" stroke={main} strokeWidth="1.1" strokeLinecap="round" />
      <path d="M19 50 L41 50" stroke={main} strokeWidth="0.6" strokeOpacity="0.5" strokeDasharray="0.8 1.2" />
    </svg>
  );
  if (kind === "cup") return (
    <svg viewBox="0 0 60 60" width="78%" style={{ maxWidth: 56 }}>
      <defs>
        <linearGradient id="cup-fill" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stopColor={accent} stopOpacity="0.45" />
          <stop offset="100%" stopColor={accent} stopOpacity="0.12" />
        </linearGradient>
      </defs>
      {/* 杯体 */}
      <path d="M16 17 Q30 23 44 17 L41 38 Q30 42 19 38 Z"
        fill="url(#cup-fill)" stroke={main} strokeWidth="1.2" strokeLinejoin="round" />
      {/* 杯口椭圆 */}
      <ellipse cx="30" cy="17" rx="14" ry="3" fill="var(--paper)" stroke={main} strokeWidth="1" />
      {/* 杯底 */}
      <ellipse cx="30" cy="44" rx="13" ry="2.8" fill="none" stroke={main} strokeWidth="1" />
      <path d="M30 44 L30 50 M22 50 L38 50" stroke={main} strokeWidth="1" strokeLinecap="round" />
      {/* 中央心形 */}
      <path d="M30 24 C 27.5 22, 24.5 25, 30 30 C 35.5 25, 32.5 22, 30 24 Z" fill={accent} />
    </svg>
  );
  if (kind === "wand") return (
    <svg viewBox="0 0 60 60" width="86%" style={{ maxWidth: 70 }}>
      {/* 8 根权杖（4 横排 × 2 层），呈交错动感 */}
      {[
        {x:18,r:-22},{x:42,r:22},{x:24,r:-12},{x:36,r:12},

        <g key={i} transform={`translate(${w.x} 30) rotate(${w.r})`}>

          <line x1="-1" y1="-10" x2="1" y2="-6" stroke={main} strokeOpacity="0.4" strokeWidth="0.5" />
          <line x1="-1" y1="2" x2="1" y2="6" stroke={main} strokeOpacity="0.4" strokeWidth="0.5" />
          {/* 顶端火苗 */}
          <circle cx="0" cy="-19" r="2.2" fill={accent} />
          <path d="M0 -22 q-2 -2 0 -4 q2 2 0 4 z" fill={accent} fillOpacity="0.7" />
        </g>
      ))}
    </svg>
  );
  if (kind === "world") return (
    <svg viewBox="0 0 60 60" width="86%" style={{ maxWidth: 70 }}>
      {/* 桂冠椭圆 */}

    </svg>

  return null;
}


function CrossAlignmentBoard() {
  const rows = [
    { topic: "career_direction", cn: "中", wt: "西", state: "consensus" },

  const stateMark = { consensus: "= ", divergence: "≠ ", complementary: "+ " };
  const stateColor = { consensus: "var(--cinnabar)", divergence: "var(--ink)", complementary: "var(--jade)" };
  return (
    <div>
      {rows.map((r, i) => (
        <div key={i} style={{ display: "grid", gridTemplateColumns: "20px 1fr", gap: 10, padding: "10px 0", borderBottom: i === rows.length - 1 ? "none" : "var(--rule)", alignItems: "baseline" }}>

          <div>
            <div className="mono" style={{ fontSize: 11, color: "var(--ink-3)" }}>{r.topic}</div>
            <div className="caps" style={{ fontSize: 9, color: stateColor[r.state], marginTop: 2 }}>{r.state}</div>
          </div>
        </div>
      ))}
    </div>
  );
}

function BigStat({ label, v }) {
  return (
    <div>
      <div className="caps" style={{ fontSize: 10 }}>{label}</div>
      <div style={{ fontFamily: "var(--serif-en)", fontStyle: "italic", fontSize: 38, color: "var(--cinnabar)", marginTop: 6 }}>{v}</div>
    </div>
  );
}

window.ReportScreen = ReportScreen;

  </script>

  <script type="text/babel">
// Archive — single-column profile + past readings, editorial style
function ArchiveScreen({ go, profile, sessions, hasProfile }) {
  const p = profile || SAMPLE_PROFILE;
  const [date, time] = (p.birth || "").split(" ");
  const sealedAt = hasProfile
    ? (sessions?.[0]?.date || new Date().toISOString().slice(0, 10))
    : "2026-05-09 14:32";
  const archiveId = ((p.name || "demo").slice(0, 4).toLowerCase() + "·" + (p.birth || "").slice(0, 4)) || "demo";
  const sc = SCENARIO_MAP[p.scenario] || SCENARIO_MAP.general;

  return (
    <div className="fade-in screen" style={{ position: "relative", minHeight: "calc(100vh - 80px)" }}>
      <WatermarkChar char="档" size={620} top={40} right={-60} opacity={0.05} />

      <div style={{ maxWidth: 720, margin: "0 auto", padding: "60px 24px 100px" }}>
        <Lockup cn="档案" en="ARCHIVE" size="lg" />
        <p style={{ fontFamily: "var(--serif-cn)", fontSize: 14, color: "var(--ink-3)", lineHeight: 1.7, marginTop: 16, maxWidth: 520 }}>

        </p>

        {/* Identity */}
        <div style={{ marginTop: 56, paddingTop: 32, borderTop: "1px solid var(--ink)" }}>
          <div className="caps" style={{ fontSize: 10, color: "var(--cinnabar)" }}>本命 · NATIVE CHART</div>
          <div style={{ fontFamily: "var(--serif-cn)", fontWeight: 700, fontSize: 56, lineHeight: 1.05, marginTop: 12, letterSpacing: "-0.005em" }}>
            {p.name}
          </div>
          <div className="em" style={{ fontFamily: "var(--serif-en)", fontStyle: "italic", fontSize: 22, color: "var(--ink-3)", marginTop: 6 }}>
            {p.en && p.en !== p.name ? `${p.en} · ` : ""}born {date} · {p.placeEn || p.place}
          </div>
        </div>

        {/* Detail rows */}
        <div style={{ marginTop: 40 }}>
          <ArchiveRow cn="生辰"   en="DATE OF BIRTH" v={date}     sub={p.name === "陈书雅" ? "辛未年 · 丙申月 · 丁巳日" : null} first />
          <ArchiveRow cn="时辰"   en="HOUR"          v={time}     sub="真太阳时已校正" />
          <ArchiveRow cn="出生地" en="BIRTHPLACE"    v={p.place}  sub={p.placeEn !== p.place ? p.placeEn : null} />
          <ArchiveRow cn="性别"   en="GENDER"        v={p.gender} />
          <ArchiveRow cn="历法"   en="CALENDAR"      v="阳历"     sub="gregorian · auto-converted" />
          <ArchiveRow cn="情境"   en="SCENARIO"      v={sc.cn}    sub={sc.en} />
        </div>

        {/* Seal */}
        <div style={{ marginTop: 48, paddingTop: 28, borderTop: "1px solid var(--ink)", display: "flex", justifyContent: "space-between", alignItems: "baseline", flexWrap: "wrap", gap: 16 }}>
          <div>
            <div className="caps" style={{ fontSize: 10 }}>立档时 · SEALED AT</div>
            <div style={{ fontFamily: "var(--serif-en)", fontStyle: "italic", fontSize: 22, marginTop: 4, color: "var(--ink-2)" }}>{sealedAt}</div>
          </div>
          <div className="mono" style={{ fontSize: 12, color: "var(--ink-3)", letterSpacing: "0.18em" }}>
            档号 · #{archiveId}
          </div>
        </div>

        {/* Past readings */}
        <div style={{ marginTop: 80 }}>
          <div className="caps" style={{ fontSize: 10, color: "var(--cinnabar)" }}>过往 · PAST READINGS</div>
          <div style={{ fontFamily: "var(--serif-cn)", fontSize: 14, color: "var(--ink-3)", marginTop: 6 }}>
            {sessionList.length} 卷 · {sessionList.length} readings
          </div>
          <div style={{ marginTop: 20 }}>
            {sessionList.map((s, i) => (
              <button
                key={s.id}
                onClick={() => s.current ? go("chat") : go("report")}
                style={{
                  display: "block", width: "100%", textAlign: "left",
                  padding: "22px 0",
                  borderTop: i === 0 ? "1px solid var(--ink)" : "none",
                  borderBottom: "var(--rule)",
                  background: "transparent", border: "none",
                  borderTopWidth: i === 0 ? 1 : 0, borderTopStyle: "solid", borderTopColor: "var(--ink)",
                  cursor: "pointer",
                }}
              >
                <div style={{ display: "flex", justifyContent: "space-between", alignItems: "baseline", gap: 16 }}>
                  <span style={{ fontFamily: "var(--serif-cn)", fontSize: 20, fontWeight: 600, color: "var(--ink)" }}>{s.topic}</span>
                  <span className="mono" style={{ fontSize: 11, color: "var(--ink-3)", letterSpacing: "0.12em" }}>{s.date}</span>
                </div>
                <div style={{ display: "flex", justifyContent: "space-between", alignItems: "baseline", marginTop: 6 }}>
                  <span className="em" style={{ fontFamily: "var(--serif-en)", fontStyle: "italic", fontSize: 13, color: "var(--ink-3)" }}>
                    {s.scenarioCn} · {s.scenarioEn}
                  </span>
                  {s.current
                    ? <span className="caps" style={{ fontSize: 9, color: "var(--cinnabar)" }}>本次 · current</span>
                    : <span className="caps" style={{ fontSize: 9, color: "var(--ink-3)" }}>已封 · sealed →</span>}

              </button>
            ))}

        {/* Actions */}
        <div style={{ marginTop: 80, display: "flex", justifyContent: "space-between", alignItems: "center", flexWrap: "wrap", gap: 12 }}>

            <button className="btn btn-ghost" onClick={() => go("chart")}>看本命盘 · view chart</button>

}

function ArchiveRow({ cn, en, v, sub, first }) {
  return (
    <div style={{
      display: "grid", gridTemplateColumns: "180px 1fr", gap: 24,
      padding: "18px 0",
      borderTop: first ? "1px solid var(--ink)" : "none",
      borderBottom: "var(--rule)",
      alignItems: "baseline",
    }}>

window.ArchiveScreen = ArchiveScreen;

  </script>

  <script type="text/babel">
// scenario code → bilingual labels
const SCENARIO_MAP = {
  general:  { cn: "通览", en: "general" },
  career:   { cn: "事业", en: "career" },
  relation: { cn: "关系", en: "relation" },
  study:    { cn: "学业", en: "study" },
  health:   { cn: "安康", en: "health" },
};

// Root app — wires it all up
function App() {
  const [screen, setScreen] = useState("home");

  // Persisted state (localStorage). Default = SAMPLE so a fresh visitor sees
  // the full demo without an empty shell. Once user 立档s, their data wins.
  const [profile, setProfile] = useState(() => {
    try { const s = localStorage.getItem("suan_profile"); if (s) return JSON.parse(s); } catch {}
    return SAMPLE_PROFILE;
  });
  const [question, setQuestion] = useState(() => {
    try { const s = localStorage.getItem("suan_question"); if (s) return s; } catch {}
    return SAMPLE_QUESTION;
  });
  const [sessions, setSessions] = useState(() => {
    try { const s = localStorage.getItem("suan_sessions"); if (s) return JSON.parse(s); } catch {}
    return [
      { id: "s-001", date: "2026-05-09", topic: "事业方向之问", scenarioCn: "事业", scenarioEn: "career",   current: true  },
      { id: "s-002", date: "2026-04-21", topic: "流年财运之问", scenarioCn: "财运", scenarioEn: "fortune",  current: false },
      { id: "s-003", date: "2026-03-15", topic: "关系合相之问", scenarioCn: "关系", scenarioEn: "relation", current: false },
    ];
  });

  // hasProfile = user has explicitly 立档 (not just viewing demo)
  const [hasProfile, setHasProfile] = useState(() => {
    try { return localStorage.getItem("suan_sealed") === "1"; } catch { return false; }
  });

  const [tweaks, setTweaks] = useTweaks(window.__TWEAK_DEFAULTS);

  // Real backend charts (bazi/ziwei/natal_astro/numerology). Fetched on profile change.
  const [charts, setCharts]               = useState(null);
  const [chartsLoading, setChartsLoading] = useState(false);
  const [chartsError, setChartsError]     = useState(null);

  useEffect(() => {
    let aborted = false;
    const fetchCharts = async () => {
      if (!profile?.birth) return;
      setChartsLoading(true); setChartsError(null);
      try {
        const res = await fetch("/api/v1/charts", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            profile: {
              name: profile.name,
              gender: profile.gender === "女" ? "female" : profile.gender === "男" ? "male" : "other",
              date: (profile.birth || "").split(" ")[0] || "",
              time: (profile.birth || "").split(" ")[1] || "",
              unknownTime: false,
              place: profile.place,
              timezone_offset: 8.0,
              scenario: "chat",
            },
            question: "",
          }),
        });
        const j = await res.json();
        if (!aborted) setCharts(j);
      } catch (err) {
        if (!aborted) setChartsError(err.message || "排盘失败");
      } finally {
        if (!aborted) setChartsLoading(false);
      }
    };
    fetchCharts();
    return () => { aborted = true; };
  }, [profile?.name, profile?.birth, profile?.place, profile?.gender]);

  // persist
  useEffect(() => { try { localStorage.setItem("suan_profile", JSON.stringify(profile)); } catch {} }, [profile]);
  useEffect(() => { try { localStorage.setItem("suan_question", question); } catch {} }, [question]);
  useEffect(() => { try { localStorage.setItem("suan_sessions", JSON.stringify(sessions)); } catch {} }, [sessions]);
  useEffect(() => { try { localStorage.setItem("suan_sealed", hasProfile ? "1" : "0"); } catch {} }, [hasProfile]);

  // sync body data attrs from tweaks
  useEffect(() => {
    document.body.dataset.mode    = tweaks.mode;
    document.body.dataset.palette = tweaks.palette;
    document.body.dataset.density = tweaks.density;
  }, [tweaks.mode, tweaks.palette, tweaks.density]);

  const go = (id) => {
    setScreen(id);
    window.scrollTo({ top: 0, behavior: "instant" });
  };

  // Called when user clicks 成档 in onboarding. data = full form snapshot.
  const sealProfile = (data) => {
    const newProfile = {
      name:    data.name?.trim() || "未署名",
      pinyin:  "",
      en:      data.name?.trim() || "—",
      gender:  data.gender || "",
      birth:   `${data.date} ${data.time}`,
      place:   data.place?.trim() || "—",
      placeEn: data.place?.trim() || "—",
      scenario: data.scenario || "general",
    };
    setProfile(newProfile);
    if (data.question) setQuestion(data.question);
    // prepend new session, mark old current ones as sealed
    const today = new Date().toISOString().slice(0, 10);
    const topic = (data.question || question || "").slice(0, 18) + (data.question?.length > 18 ? "…" : "");
    const sc = SCENARIO_MAP[data.scenario] || SCENARIO_MAP.general;
    setSessions(prev => [
      { id: "s-" + Date.now().toString(36), date: today, topic: topic || "立档", scenarioCn: sc.cn, scenarioEn: sc.en, current: true },
      ...prev.map(s => ({ ...s, current: false })),
    ]);
    setHasProfile(true);
  };

  const resetAll = () => {
    try {
      localStorage.removeItem("suan_profile");
      localStorage.removeItem("suan_question");
      localStorage.removeItem("suan_sessions");
      localStorage.removeItem("suan_sealed");
    } catch {}
    window.location.reload();
  };

  return (
    <div style={{ minHeight: "100vh" }}>
      <TopNav current={screen} setScreen={go} hasProfile={hasProfile} profile={profile} />

      <main data-screen-label={({
        home: "01 Landing", onboard: "02 Onboarding", chart: "03 Chart",
        chat: "04 Consult", report: "05 Report", archive: "06 Archive",
      })[screen]}>
        {screen === "home"    && <LandingScreen go={go} hasProfile={hasProfile} profile={profile} />}
        {screen === "onboard" && <OnboardingScreen go={go} sealProfile={sealProfile} initialProfile={profile} initialQuestion={question} />}
        {screen === "chart"   && <ChartScreen go={go} profile={profile} charts={charts} chartsLoading={chartsLoading} chartsError={chartsError} />}
        {screen === "chat"    && <ChatScreen go={go} animSpeed={tweaks.animSpeed || 1} profile={profile} question={question} />}
        {screen === "report"  && <ReportScreen go={go} profile={profile} charts={charts} />}
        {screen === "archive" && <ArchiveScreen go={go} profile={profile} sessions={sessions} hasProfile={hasProfile} />}
      </main>

      {screen !== "chat" && <Footer />}

      <TweaksPanel title="Tweaks · 调">
        <TweakSection label="外观 · Appearance" />
        <TweakRadio label="Mode" value={tweaks.mode}
          options={[{ value: "light", label: "宣纸" }, { value: "dark", label: "黛" }]}
          onChange={v => setTweaks({ mode: v })} />
        <TweakRadio label="Accent" value={tweaks.palette}
          options={[{ value: "cinnabar", label: "朱砂" }, { value: "ink-only", label: "纯墨" }]}
          onChange={v => setTweaks({ palette: v })} />
        <TweakRadio label="Density" value={tweaks.density}
          options={[{ value: "airy", label: "疏" }, { value: "normal", label: "常" }, { value: "dense", label: "密" }]}
          onChange={v => setTweaks({ density: v })} />
        <TweakSection label="动效 · Motion" />
        <TweakSlider label="Stream speed" min={0.5} max={3} step={0.25} value={tweaks.animSpeed} unit="×"
          onChange={v => setTweaks({ animSpeed: v })} />
        <TweakSection label="数据 · Data" />
        <TweakButton label="↻ 清档案 · reset all" onClick={resetAll} />
      </TweaksPanel>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);

  </script>
</body>
